syntax = "proto3";

service Dashboard {
	rpc SendBatchUpdate (BatchUpdate) returns (UpdateReply);
	rpc SendLossUpdate (LossUpdate) returns (UpdateReply);
}

message ImageData {
	bytes image = 1;
	int32 width = 2;
	int32 height = 3;
}

message BatchUpdate {
	repeated ImageData images = 1;
	repeated string predictions = 2;
	repeated string groundTruths = 3;
	int32 index = 4;
}

message LossUpdate {
	float lossValue = 1;
	int32 iteration = 2;
}

message UpdateReply {
	bool status = 1;
string message = 2;
int32 errorCode = 3;
}
